[project]
name = "forecasting-db"
version = "1.1.0"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"             # keeps isort compatible with black formatting
multi_line_output = 3         # vertical hanging indent (keeps parentheses)
include_trailing_comma = true # good for multi-line imports
force_grid_wrap = 0
use_parentheses = true
line_length = 88              # adjust to your project style

[tool.flake8]
max-line-length = 88
ignore = ["D203", "D100", "D103", "D104", "D101", "W503"]
