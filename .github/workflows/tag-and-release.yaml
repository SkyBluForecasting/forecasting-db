name: Tag, Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.2.3)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow pushing tags/releases
      packages: write  # allow publishing to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update pyproject.toml version
        run: |
          TAG=${{ github.event.inputs.tag }}
          VERSION=${TAG#v}   # strip leading 'v'
          echo "Updating pyproject.toml version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          git add pyproject.toml
          git commit -m "Bump version to $VERSION" || echo "No changes to commit"
          git push origin HEAD || echo "Already up to date"

      - name: Create and push tag
        run: |
          TAG=${{ github.event.inputs.tag }}
          git tag $TAG || echo "Tag already exists"
          git push origin $TAG || echo "Tag already exists"

      - name: Build Python package
        run: |
          python -m pip install --upgrade build twine
          rm -rf dist
          python -m build

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -m twine upload \
            --repository-url https://upload.pypi.github.com/organizations/SkyBluForecasting/packages/python/ \
            -u mfavit \
            -p $GH_PAT \
            dist/*

      - name: Create GitHub release
        run: |
          TAG=${{ github.event.inputs.tag }}
          gh release create "$TAG" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
