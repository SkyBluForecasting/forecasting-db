name: Tag and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.2.3)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow pushing tags/releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for tagging

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update pyproject.toml version
        run: |
          TAG=${{ github.event.inputs.tag }}
          # Remove leading "v" if your tag is like "v1.2.3"
          VERSION=${TAG#v}
          echo "Updating pyproject.toml version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          git add pyproject.toml
          git commit -m "Bump version to $VERSION"
          git push origin HEAD

      - name: Create and push tag
        run: |
          TAG=${{ github.event.inputs.tag }}
          git tag $TAG
          git push origin $TAG

      - name: Create GitHub release
        run: |
          TAG=${{ github.event.inputs.tag }}
          gh release create "$TAG" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
