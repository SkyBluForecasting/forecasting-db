name: Run DB Migrations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to use'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Debug SQLALCHEMY_URL
        run: |
          echo "SQLALCHEMY_URL (masked) = ${SQLALCHEMY_URL/$(echo $DB_PASSWORD)/***}"
          echo "First 30 chars: ${SQLALCHEMY_URL:0:30}"
        env:
          SQLALCHEMY_URL: ${{ secrets.SQLALCHEMY_URL }}

      - name: Run Alembic migrations
        env:
          SQLALCHEMY_URL: ${{ secrets.SQLALCHEMY_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source venv/bin/activate
          alembic upgrade head
